name: proofs

on:
  push:
  pull_request:

jobs:
  bend:
    runs-on: ubuntu-latest
    env:
      BEND_NO_TELEMETRY: 1
    steps:
      - uses: actions/checkout@v5
      - name: Install Bend
        run: |
          curl -fsSL https://bend-lang.com/install.sh | sh
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"
      - name: Install Lean
        run: |
          curl -fsSL https://elan.lean-lang.org/elan-init.sh |
            sh -s -- -y --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Report the toolchain
        run: |
          bend version
          lean --version
      - name: Check every module
        working-directory: bend
        run: |
          for f in *.bend; do
            case "$f" in LAWS.bend|PROOF.bend) continue;; esac
            echo "== $f"
            bend --check-only "$f"
          done
      - name: Check every citation against the corpus
        run: python3 tools/check_citations.py
      - name: Prove the laws
        working-directory: bend
        run: bend PROOF.bend
      - name: Re-check the proofs with the Lean kernel
        working-directory: bend
        run: bend PROOF.bend --verdict

  # The driving game's model, the town and the world. Its own job, so it runs
  # beside the catalogue's proofs rather than after them.
  game:
    runs-on: ubuntu-latest
    env:
      BEND_NO_TELEMETRY: 1
    defaults:
      run:
        working-directory: web/logic
    steps:
      - uses: actions/checkout@v5
      - name: Install Bend
        run: |
          curl -fsSL https://bend-lang.com/install.sh | sh
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"
      - name: Install Lean
        run: |
          curl -fsSL https://elan.lean-lang.org/elan-init.sh |
            sh -s -- -y --default-toolchain "$(cat ../../lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Prove the world's laws
        run: bend PROOF_WORLD.bend
      - name: Re-check the world's laws with the Lean kernel
        run: bend PROOF_WORLD.bend --verdict
      # The kernel runs out of fuel on some of the town's laws, so these go
      # through Bend's checker only.
      - name: Prove the game's and the town's laws
        run: bend PROOF.bend

  # The page that draws the model. The build compiles the Bend modules first, so
  # this job also proves the generated modules match the hand-written types.
  web:
    runs-on: ubuntu-latest
    env:
      BEND_NO_TELEMETRY: 1
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - name: Install Bend
        run: |
          curl -fsSL https://bend-lang.com/install.sh | sh
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"
      - name: Install Vite+
        run: |
          curl -fsSL https://vite.plus | CI=1 VP_NODE_MANAGER=no VP_PM_MANAGER=no bash
          echo "$HOME/.local/share/vite-plus/bin" >> "$GITHUB_PATH"
      - name: Install packages
        run: vp install
      - name: Format, lint and types
        run: vp check
      - name: Match the types to the compiled model
        run: vp run contract
      - name: Test
        run: vp test
      - name: Check the world's plan
        run: vp run plan
      - name: Build
        run: vp build
