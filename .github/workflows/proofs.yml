name: proofs

on:
  push:
  pull_request:

jobs:
  bend:
    runs-on: ubuntu-latest
    env:
      BEND_NO_TELEMETRY: 1
    steps:
      - uses: actions/checkout@v5
      - name: Install Bend
        run: |
          curl -fsSL https://bend-lang.com/install.sh | sh
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"
      - name: Install Lean
        run: |
          curl -fsSL https://elan.lean-lang.org/elan-init.sh |
            sh -s -- -y --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Report the toolchain
        run: |
          bend version
          lean --version
      - name: Check every module
        working-directory: bend
        run: |
          for f in *.bend; do
            case "$f" in LAWS.bend|PROOF.bend) continue;; esac
            echo "== $f"
            bend --check-only "$f"
          done
      - name: Check every citation against the corpus
        run: python3 tools/check_citations.py
      - name: Prove the laws
        working-directory: bend
        run: bend PROOF.bend
      - name: Re-check the proofs with the Lean kernel
        working-directory: bend
        run: bend PROOF.bend --verdict
