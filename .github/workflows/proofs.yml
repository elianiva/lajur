name: proofs

on:
  push:
  pull_request:

jobs:
  bend:
    runs-on: ubuntu-latest
    env:
      BEND_NO_TELEMETRY: 1
    steps:
      - uses: actions/checkout@v5
      - name: Install Bend
        run: |
          curl -fsSL https://bend-lang.com/install.sh | sh
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"
      - name: Report the toolchain
        run: bend version
      - name: Check every module
        working-directory: bend
        run: |
          for f in *.bend; do
            case "$f" in LAWS.bend|PROOF.bend) continue;; esac
            echo "== $f"
            bend --check-only "$f"
          done
      - name: Prove the laws
        working-directory: bend
        run: bend PROOF.bend
