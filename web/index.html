<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>lajur</title>
  </head>
  <body>
    <div id="stage"></div>

    <div id="hud">
      <svg id="dial" viewBox="0 0 224 224" aria-label="Speed"></svg>
      <div id="lamps" data-signal="Off">
        <svg viewBox="0 0 24 24"><path d="M2 12 11 3v6h11v6H11v6z" /></svg>
        <svg viewBox="0 0 24 24"><path d="M2 12 11 3v6h11v6H11v6z" /></svg>
      </div>
    </div>

    <div id="licence" aria-label="Licence points">
      <span>SIM</span>
      <ol id="pips"></ol>
    </div>

    <div id="shift">
      <b id="clock">4:00</b>
      <span id="earned">Rp0</span>
    </div>

    <div id="order" data-aboard="false">
      <strong id="task">Pickup</strong>
      <span id="far">0 m</span>
      <span id="due"></span>
    </div>

    <ol id="slips"></ol>

    <section id="verdict" hidden>
      <h1 id="ending">Tilang</h1>
      <p id="fares"><span>Fares</span><b></b></p>
      <ul id="causes"></ul>
      <p id="total"><span>Rp</span><b></b></p>
      <p id="tally"><span>Poin</span><b></b></p>
      <kbd>R</kbd>
    </section>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
