<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>lajur</title>
  </head>
  <body>
    <div id="stage"></div>

    <div id="hud">
      <svg id="dial" viewBox="0 0 224 224" aria-label="Speed"></svg>
      <div id="light" data-state="3"><i></i><i></i><i></i></div>
      <div id="lamps" data-signal="Off">
        <svg viewBox="0 0 24 24"><path d="M2 12 11 3v6h11v6H11v6z" /></svg>
        <svg viewBox="0 0 24 24"><path d="M2 12 11 3v6h11v6H11v6z" /></svg>
      </div>
    </div>

    <div id="licence" aria-label="Licence points">
      <span>SIM</span>
      <ol id="pips"></ol>
    </div>

    <div id="shift">
      <b id="clock">4:00</b>
      <span id="earned">Rp0</span>
      <span id="stars">★ 5.0</span>
    </div>

    <div id="order" data-aboard="false">
      <strong id="task">Pickup</strong>
      <span id="far">0 m</span>
      <span id="due"></span>
    </div>

    <ol id="slips"></ol>

    <section id="verdict" class="panel" hidden>
      <h1 id="ending">Tilang</h1>
      <p id="fares"><span>Fares</span><b></b></p>
      <p id="rating"><span>Rating</span><b></b></p>
      <ul id="causes"></ul>
      <p id="total"><span>Rp</span><b></b></p>
      <p id="tally"><span>Poin</span><b></b></p>
      <nav>
        <button data-command="restart"><kbd>R</kbd>Again</button>
        <button data-command="menu"><kbd>Q</kbd>Menu</button>
      </nav>
    </section>

    <section id="pause" class="panel" hidden>
      <h1>Paused</h1>
      <nav>
        <button data-command="pause"><kbd>Esc</kbd>Resume</button>
        <button data-command="restart"><kbd>R</kbd>Restart</button>
        <button data-command="menu"><kbd>Q</kbd>Menu</button>
      </nav>
    </section>

    <section id="menu" class="panel">
      <h1>lajur</h1>
      <button id="go" data-command="start"><kbd>Enter</kbd>Start shift</button>
      <dl id="keys">
        <dt><kbd>↑</kbd><kbd>↓</kbd></dt>
        <dd>Gas, brake</dd>
        <dt><kbd>←</kbd><kbd>→</kbd></dt>
        <dd>Indicate, change lane, turn</dd>
        <dt><kbd>Esc</kbd></dt>
        <dd>Pause</dd>
        <dt><kbd>M</kbd></dt>
        <dd>Sound</dd>
      </dl>
    </section>

    <div id="pads">
      <button data-pad="left" aria-label="Indicate left">◀</button>
      <button data-pad="right" aria-label="Indicate right">▶</button>
      <button data-pad="down" aria-label="Brake">■</button>
      <button data-pad="up" aria-label="Gas">▲</button>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
